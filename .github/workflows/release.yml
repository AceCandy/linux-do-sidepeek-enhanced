name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup archive tools
        run: sudo apt-get update && sudo apt-get install -y jq zip unzip

      - name: Run static checks
        run: bash scripts/check.sh

      - name: Build release artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          build_output=$(bash scripts/build-release-artifacts.sh "$TAG" "$PWD/dist")
          echo "$build_output"
          echo "$build_output" | grep '^CHROME_ZIP_PATH=' >> "$GITHUB_ENV"
          echo "$build_output" | grep '^FIREFOX_XPI_PATH=' >> "$GITHUB_ENV"

      - name: Validate release artifacts
        run: bash scripts/check-release-artifacts.sh "${{ env.CHROME_ZIP_PATH }}" "${{ env.FIREFOX_XPI_PATH }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            ${{ env.CHROME_ZIP_PATH }}
            ${{ env.FIREFOX_XPI_PATH }}
            userscript/linuxdo-sidepeek.user.js
          generate_release_notes: true
          make_latest: true
